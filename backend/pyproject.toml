[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terceiro360-backend"
version = "0.1.0"
description = "TERCEIRO360 — inteligência e automação para o Terceiro Setor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "fpdf2>=2.8",
    "pyotp>=2.9",
    "cryptography>=42.0",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

# Dito explicitamente: a descoberta automática do setuptools varia com a versão
# e com o que existe na pasta no momento do build, e falhar por isso dentro de
# uma imagem é um erro difícil de ler.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

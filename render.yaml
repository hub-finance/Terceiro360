# Publicação no Render — "blueprint".
#
# Com este arquivo, publicar deixa de ser uma sequência de formulários: no
# Render, em New → Blueprint, apontando para este repositório, ele cria os dois
# serviços já configurados. Só duas informações ficam para você preencher, e
# elas são justamente as que não podem estar num arquivo versionado: a string
# de conexão do Supabase e as chaves.
#
# O banco NÃO está aqui de propósito: ele é o Supabase, em São Paulo.
# Veja docs/publicacao.md.

services:
  - type: web
    name: terceiro360-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /saude
    envVars:
      # Cole a string do **Transaction pooler** do Supabase (porta 6543).
      # `sync: false` = o Render pergunta na hora, e o valor nunca entra no
      # repositório.
      - key: T360_DATABASE_URL
        sync: false

      # Geradas pelo próprio Render, uma vez, e guardadas por ele.
      # ATENÇÃO: anote T360_CHAVE_DADOS num cofre assim que for gerada. Ela
      # cifra os CPFs; perdê-la torna os dados gravados ilegíveis para sempre.
      - key: T360_SECRET_KEY
        generateValue: true
      - key: T360_CHAVE_DADOS
        generateValue: true

      - key: T360_ENVIRONMENT
        value: production
      - key: T360_DEBUG
        value: "false"

      # "true"  = perfis, base normativa e modelos de documento
      # "demo"  = o acima + entidade de demonstração e primeiro usuário
      # "false" = nada
      # É idempotente: rodar de novo atualiza o que mudou e não duplica.
      # Use "demo" na primeira subida de um ambiente de testes — é o que cria
      # o usuário de acesso sem precisar de terminal no contêiner.
      - key: T360_CARGA_INICIAL
        value: "demo"

      # Preencha com o endereço do painel depois que ele subir, no formato
      # ["https://terceiro360-painel.onrender.com"].
      # Não é o que faz o painel funcionar: o navegador nunca chama a API
      # direto — quem chama é o servidor do Next, e servidor não tem CORS.
      # Isto serve para o dia em que outra origem precisar consultar a API.
      - key: T360_CORS_ORIGENS
        sync: false

  - type: web
    name: terceiro360-painel
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Endereço interno da API, preenchido pelo próprio Render. Chega como
      # "host:porta", sem esquema; `src/lib/endereco.ts` completa o http://.
      - key: API_URL
        fromService:
          type: web
          name: terceiro360-api
          property: hostport
